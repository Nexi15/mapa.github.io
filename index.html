<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost MC | Mapa Los Santos</title>
        
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
        
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <img id="watermark" src="https://i.imgur.com/hY6E6i4.png" alt="The Lost MC">

    <!-- Panel Boczny -->
    <div id="sidebarPanel">
        <div class="sidebar-header">
            <button id="adminLoginBtn" class="npc-btn">🔑 Logowanie Admina</button>
            <h3>LISTA PUNKTÓW</h3>
            <input type="text" id="blipSearchInput" placeholder="Szukaj blipa..." autocomplete="off">
        </div>

        <!-- Dynamiczne kafelki kategorii -->
        <div id="categoriesContainer" class="categories-list"></div>

        <ul class="sidebar-list" id="sidebarBlipsList"></ul>
    </div>

    <div id="footer">
        &copy; 2026 The Lost MC | Realizacja: <span>Nexi15</span>
    </div>

    <!-- Modal Dodawania / Edycji -->
    <div id="modalOverlay"></div>
    <div id="blipModal">
        <h2 id="modalTitle">Nowy punkt</h2>
                
        <div class="input-group">
            <input type="text" id="blipTitle" placeholder="NAZWA BLIPA" autocomplete="off">
        </div>

        <div class="input-group">
            <select id="blipCategory">
                <option value="wrak">🚗 Wrak</option>
                <option value="npc">🧍 NPC</option>
                <option value="corner">🌿 Corner</option>
                <option value="taxidriver">🚖 Drug Delivery</option>
                <option value="flara">📦 Flara</option>
                <option value="przemyt">💊 Przemyt</option>
                <option value="G6">💰 G6</option>
            </select>
        </div>
                
        <div class="input-group">
            <textarea id="blipDesc" rows="4" placeholder="Szczegóły lokalizacji..."></textarea>
        </div>

        <div class="btn-container">
            <button id="cancelBlipBtn">Anuluj</button>
            <button id="saveBlipBtn">Zapisz</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
