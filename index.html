<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lost MC | Mapa Los Santos</title>
        
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
        
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
        
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <img id="watermark" src="https://i.imgur.com/hY6E6i4.png" alt="The Lost MC Watermark">

    <!-- Panel Boczny -->
    <div id="sidebarPanel">
        <div class="sidebar-header">
            <button id="adminLoginBtn" class="npc-btn">
                🔑 Logowanie Admina
            </button>

            <h3>Lista Punktów</h3>
            <input type="text" id="blipSearchInput" placeholder="Szukaj blipa..." autocomplete="off">
            <button id="toggleFiltersBtn" class="filter-btn">Filtruj widoczne blipy</button>
        </div>

        <div id="filtersContainer" class="filters-container"></div>

        <ul class="sidebar-list" id="sidebarBlipsList">
            <!-- Blipy dodawane dynamicznie -->
        </ul>
    </div>

    <!-- Stopka -->
    <div id="footer">
        &copy; 2026 The Lost MC | Realizacja: <span>Nexi15</span>
    </div>

    <!-- Modal Dodawania / Edycji -->
    <div id="modalOverlay"></div>
    <div id="blipModal">
        <h2 id="modalTitle">Nowy punkt</h2>
                
        <div class="input-group">
            <input type="text" id="blipTitle" placeholder="NAZWA BLIPA" autocomplete="off">
        </div>
                
        <div class="input-group">
            <textarea id="blipDesc" rows="4" placeholder="Szczegóły lokalizacji..."></textarea>
        </div>

        <div class="btn-container">
            <button id="cancelBlipBtn">Anuluj</button>
            <button id="saveBlipBtn">Wyślij</button>
        </div>
    </div>

    <!-- Skrypty -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
</body>
</html>
